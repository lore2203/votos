<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicción de Voto KNN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Predice tu Afinidad de Voto</h1>
        <p>Ingresa tus datos para compararlos con los patrones de votantes anteriores.</p>
        
        <form id="voter-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="age">Edad:</label>
                    <input type="number" id="age" name="age" value="40" required>
                </div>
                <div class="form-group">
                    <label for="gender">Género:</label>
                    <select id="gender" name="gender">
                        <option value="1.0">Masculino</option>
                        <option value="0.0">Femenino</option>
                        <option value="2.0">Otro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="education">Nivel Educativo:</label>
                    <select id="education" name="education">
                        <option value="0.0">Sin educación</option>
                        <option value="1.0">Primaria</option>
                        <option value="2.0">Secundaria</option>
                        <option value="3.0">Técnico</option>
                        <option value="4.0">Pregrado</option>
                        <option value="5.0">Postgrado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="employment_status">Estado Laboral:</label>
                    <select id="employment_status" name="employment_status">
                        <option value="0.0">Estudiante</option>
                        <option value="1.0">Desempleado</option>
                        <option value="2.0">Retirado</option>
                        <option value="3.0">Tiempo parcial</option>
                        <option value="4.0">Tiempo completo</option>
                        <option value="5.0">Otro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="income_bracket">Nivel de Ingresos (0-4):</label>
                    <input type="number" id="income_bracket" name="income_bracket" min="0" max="4" value="2">
                </div>
                <div class="form-group">
                    <label for="party_id_strength">Fuerza Partidista (0-4):</label>
                    <input type="number" id="party_id_strength" name="party_id_strength" min="0" max="4" value="2">
                </div>

                <div class="form-group">
                    <label for="tv_news_hours">Horas de Noticias (TV):</label>
                    <input type="number" id="tv_news_hours" name="tv_news_hours" min="0" max="5" value="2">
                </div>
                <div class="form-group">
                    <label for="social_media_hours">Horas de Redes Sociales:</label>
                    <input type="number" id="social_media_hours" name="social_media_hours" min="0" max="5" value="2">
                </div>
                <div class="form-group">
                    <label for="trust_media">Confianza en Medios (0-10):</label>
                    <input type="number" id="trust_media" name="trust_media" min="0" max="10" value="5">
                </div>
            </div>

            <button type="submit" id="submit-btn">Predecir Afinidad</button>
        </form>

        <div id="result-container" class="hidden">
            <h2>Resultado de la Predicción</h2>
            <p>El candidato con mayor probabilidad de afinidad es:</p>
            <h3 id="result-candidate"></h3>
            <p>con una confianza del <strong id="result-confidence"></strong>.</p>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
